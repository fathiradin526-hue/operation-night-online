<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت عملیات شبانه</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d25;color:#f6f1ff;font:15px Tahoma,Arial,sans-serif;padding:18px}.wrap{max-width:1000px;margin:auto}.card{background:#211b42;border:1px solid #ffffff25;border-radius:14px;padding:16px;margin:12px 0}h1,h2{color:#ffd23f}input,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #ffffff40}input{background:#100d25;color:white;max-width:100%;width:100%;margin:5px 0}button{background:#ff4f7b;color:white;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#2ec4b6;color:#082b28}small,#msg{opacity:.85}#login{max-width:420px;margin:10vh auto}#dashboard[hidden],#login[hidden]{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:9px;border-bottom:1px solid #ffffff20;vertical-align:top}th{color:#ffd23f} .scroll{overflow:auto} .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}#msg{min-height:1.5em;color:#ffd23f}@media(max-width:550px){body{padding:8px}.card{padding:10px}table{font-size:11px}}
</style></head><body><main class="wrap"><section id="login" class="card"><h1>پنل خصوصی مدیریت</h1><p>ورود فقط با اطلاعات مدیر تنظیم‌شده در متغیرهای محیطی سرور.</p><input id="u" autocomplete="username" placeholder="نام مدیر"><input id="p" type="password" autocomplete="current-password" placeholder="رمز مدیر"><button id="loginBtn">ورود امن</button><div id="msg"></div></section><section id="dashboard" hidden><h1>مدیریت عملیات شبانه</h1><p>تغییرات سکه ثبت می‌شوند و در تاریخچه باقی می‌مانند.</p><button class="secondary" id="refresh">به‌روزرسانی</button><button id="logout">خروج</button><div class="card"><h2>افزایش یا کاهش سکه</h2><div class="row"><label>شناسه عددی بازیکن<input id="userId" type="number" min="100001" placeholder="مثلاً 100001"></label><label>مقدار سکه (برای کسر عدد منفی)<input id="delta" type="number" step="1" placeholder="مثلاً 500 یا -100"></label><label>توضیح تراکنش<input id="note" maxlength="160" placeholder="دلیل تغییر موجودی"></label></div><button class="secondary" id="apply">ثبت تراکنش</button><div id="msg2"></div></div><div class="card"><h2>حساب‌های بازیکنان</h2><div class="scroll"><table><thead><tr><th>شناسه</th><th>نام کاربری</th><th>سکه</th><th>تاریخ ساخت</th><th>انتخاب</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card"><h2>تاریخچه تراکنش‌ها</h2><div class="scroll"><table><thead><tr><th>زمان</th><th>شناسه</th><th>بازیکن</th><th>تغییر</th><th>قبل</th><th>بعد</th><th>توضیح</th></tr></thead><tbody id="tx"></tbody></table></div></div></section></main><script>
let token=sessionStorage.getItem('opn:admin-token')||'';const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('fa-IR');async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'پاسخ سرور نامعتبر است'}));if(!r.ok)throw Error(d.error||'خطا');return d}function message(s,el='msg'){ $(el).textContent=s }
async function login(){message('در حال ورود…');try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});token=d.token;sessionStorage.setItem('opn:admin-token',token);$('login').hidden=true;$('dashboard').hidden=false;await refresh()}catch(e){message(e.message)}}async function refresh(){try{const [a,b]=await Promise.all([api('/api/admin/users'),api('/api/admin/transactions')]);$('users').innerHTML=a.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${fmt(u.coins)}</td><td>${new Date(u.createdAt).toLocaleString('fa-IR')}</td><td><button class="secondary" data-id="${u.id}">انتخاب</button></td></tr>`).join('')||'<tr><td colspan="5">هنوز حسابی ساخته نشده است.</td></tr>';$('tx').innerHTML=b.transactions.map(t=>`<tr><td>${new Date(t.createdAt).toLocaleString('fa-IR')}</td><td>${t.userId}</td><td>${esc(t.username)}</td><td>${t.delta>0?'+':''}${fmt(t.delta)}</td><td>${fmt(t.before)}</td><td>${fmt(t.after)}</td><td>${esc(t.note)}</td></tr>`).join('')||'<tr><td colspan="7">تراکنشی ثبت نشده است.</td></tr>';message('اطلاعات به‌روز شد.','msg2')}catch(e){message(e.message,'msg2');if(/ورود مدیر/.test(e.message)){logout()}}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function apply(){message('در حال ثبت…','msg2');try{const d=await api('/api/admin/coins',{method:'POST',body:JSON.stringify({userId:$('userId').value,delta:$('delta').value,note:$('note').value})});message(`ثبت شد؛ موجودی جدید ${fmt(d.user.coins)} سکه است.`,'msg2');$('delta').value='';$('note').value='';await refresh()}catch(e){message(e.message,'msg2')}}function logout(){token='';sessionStorage.removeItem('opn:admin-token');$('dashboard').hidden=true;$('login').hidden=false} $('loginBtn').onclick=login;$('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refresh').onclick=refresh;$('apply').onclick=apply;$('logout').onclick=logout;$('users').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)$('userId').value=b.dataset.id});if(token){$('login').hidden=true;$('dashboard').hidden=false;refresh()}
</script></body></html>
